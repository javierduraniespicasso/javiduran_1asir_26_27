<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0 auto;
            text-align: center;
            
        }
        main {
            padding-top: 15px;
            width: 100%;
            height: 912px;
            background-color: gray;
             }
        header {
            width: 90%;
            height: 50px;
            background-color: orange;
            color: blue;
            border-radius: 40px;
            padding: 5px;
            margin-left: 5%;
            margin-right: 5%;
        }
        aside {
            width: 25%;
            height: 95%;
            background-color: orange;
            color: blue;
            border-radius: 40px;
            padding: 5px;
            margin-top: 10px;
            margin-bottom: 10px;
            margin-left: 2%;
            float: left;
        }
        article {
            width: 69%;
            height: 95%;
            background-color: orange;
            color: blue;
            border-radius: 40px;
            padding: 5px;
            margin-top: 10px;
            margin-bottom: 10px;
            margin-right: 2%;
            float: right;
        }
        section {
            width: 90%;
            height: 85%;
            background-color: lightgray;
            border-radius: 40px;
            margin-left: 5%;
            margin-right: 5%;
            padding: 5px;
        }
        footer {
            width: 90%;
            height: 30px;
            background-color: orange;
            color: blue;
            border-radius: 40px;
            margin-left: 5%;
            margin-right: 5%;
            padding: 5px;
        }
        section aside ul li {
            list-style: none;
        }
        section article p {
            padding-top: 100px;
            font-size: 60px;
        }

    </style>
    <title>Primera Página Web</title>
</head>
<body>
    <main>
        <header>
            <h1>Primera Página Web</h1>
        </header>
        <section>
            <aside>
                <ul>
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#">JavaScript</a></li>
                    <li><a href="#">Bandera España</a></li>
                </ul>
            </aside>
            <article>
                <p>Bienvenido a mi primera página web</p>
            </article>
        </section>
        <footer>
            <p>Copyright Javier Duran</p>
        </footer>
    </main>

</body>
</html>
